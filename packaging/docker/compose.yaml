# Nyx with Docker. Copy .env.example to .env, fill it, then:
#   docker compose --profile monitor --profile manager up -d
# Keep one profile to run a single role. Each server asks at its first start whether to
# use its own database or a shared one: add `--profile db` for the latter.
x-server: &server
  restart: unless-stopped
  init: true

# Only set by installs older than the first-start choice.
x-credentials: &pb
  NYX_PB_EMAIL: ${NYX_PB_EMAIL:-}
  NYX_PB_PASSWORD: ${NYX_PB_PASSWORD:-}

services:
  monitor:
    <<: *server
    profiles: [monitor]
    image: ghcr.io/midnights-ra1n/nyx-monitor:${NYX_VERSION:-latest}
    environment:
      <<: *pb
      NYX_BIND: 0.0.0.0:8081
      NYX_PUBLIC_URL: ${NYX_MONITOR_URL:?set it in .env}
    ports:
      - 8081:8081
    volumes:
      - monitor-data:/data
    sysctls:
      # Unprivileged ICMP probes.
      net.ipv4.ping_group_range: 0 2147483647

  manager:
    <<: *server
    profiles: [manager]
    image: ghcr.io/midnights-ra1n/nyx-manager:${NYX_VERSION:-latest}
    environment:
      <<: *pb
      NYX_BIND: 0.0.0.0:8082
      NYX_PUBLIC_URL: ${NYX_MANAGER_URL:?set it in .env}
    ports:
      - 8082:8082
    volumes:
      - manager-data:/data
    sysctls:
      # Unprivileged ICMP for IPAM scans.
      net.ipv4.ping_group_range: 0 2147483647

  # From the servers of this file, its address is http://db:8090.
  db:
    <<: *server
    profiles: [db]
    image: ghcr.io/midnights-ra1n/nyx-db:${NYX_VERSION:-latest}
    environment:
      NYX_PB_EMAIL: ${NYX_DB_EMAIL:-nyx@localhost.invalid}
      NYX_PB_PASSWORD: ${NYX_DB_PASSWORD:-}
    # Publish it only behind HTTPS or on a private network.
    ports:
      - 8090:8090
    volumes:
      - db-data:/data

  # Prefer the systemd agent: inside a container it cannot apply system updates.
  agent:
    profiles: [agent]
    image: ghcr.io/midnights-ra1n/nyx-agent:${NYX_VERSION:-latest}
    restart: unless-stopped
    init: true
    pid: host
    network_mode: host
    privileged: true # smartctl needs raw disk access
    environment:
      NYX_URL: ${NYX_AGENT_URL:-}
      NYX_TOKEN: ${NYX_AGENT_TOKEN:-}
      NYX_KEY: ${NYX_AGENT_KEY:-}
      NYX_KIND: ${NYX_AGENT_KIND:-vm}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro

volumes:
  monitor-data:
  manager-data:
  db-data:
