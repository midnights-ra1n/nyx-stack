name: nyx-monitor
version: ${VERSION}
arch: ${ARCH}
platform: linux
release: 1
maintainer: nyx-stack contributors
homepage: https://github.com/midnights-ra1n/nyx-stack
license: ${LICENSE}
description: Nyx monitoring server
depends: [nyx-base]
contents:
  - { src: "LICENSE", dst: "/usr/share/doc/nyx-monitor/copyright" }
  - { src: "THIRD-PARTY.md", dst: "/usr/share/doc/nyx-monitor/THIRD-PARTY.md" }
  - { src: "licenses/UFL-1.0.txt", dst: "/usr/share/doc/nyx-monitor/UFL-1.0.txt" }
  - { src: "dist/linux-${ARCH}/nyx-monitor", dst: "/usr/bin/nyx-monitor", file_info: { mode: 0o755 } }
  - { src: "dist/linux-amd64/nyx-agent", dst: "/usr/share/nyx/agents/nyx-agent-linux-x86_64", file_info: { mode: 0o755 } }
  - { src: "dist/linux-arm64/nyx-agent", dst: "/usr/share/nyx/agents/nyx-agent-linux-aarch64", file_info: { mode: 0o755 } }
  - { src: "packaging/systemd/nyx-monitor.service", dst: "/usr/lib/systemd/system/nyx-monitor.service"}
scripts:
  postinstall: packaging/nfpm/scripts/monitor-post.sh
  preremove: packaging/nfpm/scripts/monitor-pre-rm.sh
