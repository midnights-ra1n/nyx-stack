name: nyx-manager
version: ${VERSION}
arch: ${ARCH}
platform: linux
release: 1
maintainer: nyx-stack contributors
homepage: https://github.com/midnights-ra1n/nyx-stack
license: ${LICENSE}
description: Nyx management server
depends: [nyx-base]
contents:
  - { src: "LICENSE", dst: "/usr/share/doc/nyx-manager/copyright" }
  - { src: "THIRD-PARTY.md", dst: "/usr/share/doc/nyx-manager/THIRD-PARTY.md" }
  - { src: "licenses/UFL-1.0.txt", dst: "/usr/share/doc/nyx-manager/UFL-1.0.txt" }
  - { src: "dist/linux-${ARCH}/nyx-manager", dst: "/usr/bin/nyx-manager", file_info: { mode: 0o755 } }
  - { src: "packaging/systemd/nyx-manager.service", dst: "/usr/lib/systemd/system/nyx-manager.service"}
scripts:
  postinstall: packaging/nfpm/scripts/manager-post.sh
  preremove: packaging/nfpm/scripts/manager-pre-rm.sh
