name: nyx-db
version: ${VERSION}
arch: ${ARCH}
platform: linux
release: 1
maintainer: nyx-stack contributors
homepage: https://github.com/midnights-ra1n/nyx-stack
license: ${LICENSE}
description: Optional shared database for the Nyx servers
contents:
  - { src: "LICENSE", dst: "/usr/share/doc/nyx-db/copyright" }
  - { src: "THIRD-PARTY.md", dst: "/usr/share/doc/nyx-db/THIRD-PARTY.md" }
  - { src: "dist/linux-${ARCH}/nyx-db", dst: "/usr/bin/nyx-db", file_info: { mode: 0o755 } }
  - { src: "packaging/systemd/nyx-db.service", dst: "/usr/lib/systemd/system/nyx-db.service"}
scripts:
  postinstall: packaging/nfpm/scripts/db-post.sh
  preremove: packaging/nfpm/scripts/db-pre-rm.sh
