[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/midnights-ra1n/nyx-stack"
license = "GPL-3.0-or-later"

[workspace.dependencies]
nyx-proto = { path = "crates/nyx-proto" }
nyx-srv = { path = "crates/nyx-srv" }
nyx-db = { path = "crates/nyx-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
