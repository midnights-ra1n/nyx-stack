[package]
name = "nyx-srv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Code shared by nyx-monitor and nyx-manager"

[dependencies]
nyx-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["macros", "rt", "time", "signal", "process", "io-util", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rust-embed = "8"
libc = "0.2"
minijinja = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
getrandom = "0.3"
url = "2"
webauthn-rs = "0.5"
openssl = { version = "0.10", features = ["vendored"] }
mime_guess = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
