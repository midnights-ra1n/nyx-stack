[package]
name = "nyx-srv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Code shared by nyx-monitor and nyx-manager"

[dependencies]
nyx-proto.workspace = true
nyx-db.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["macros", "rt", "time", "net", "process", "io-util", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rust-embed = "8"
minijinja = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
getrandom = "0.3"
url = "2"
webauthn-rs = "0.5"
openssl = { version = "0.10", features = ["vendored"] }
mime_guess = "2"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tower = { version = "0.5", features = ["util"] }
# The agents' socket: axum's own needs another tungstenite.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
