[package]
name = "nyx-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Discreet Nyx host agent"

[dependencies]
nyx-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
sysinfo = "0.40"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
# The kept-open socket to the monitor, on the same TLS stack and trust store as ureq.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7"
